name: Automated Resume Generation

on:
  schedule:
    - cron: '0 0 1 * *' 
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Manual run trigger'
        required: true
        type: boolean

jobs:
  generate_resume:
    runs-on: ubuntu-latest
    environment: master
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DOC_FILE_ID: ${{ secrets.GOOGLE_DOC_FILE_ID }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib
        sudo apt-get update
        sudo apt-get install -y pandoc build-essential

    - name: Generate Resume HTML
      env:
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        GOOGLE_DOC_FILE_ID: ${{ secrets.GOOGLE_DOC_FILE_ID }}
      run: python generate_resume.py
      
    - name: Commit and Create Pull Request
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ ! -f "docs/index.html" ]; then
            echo "Error: docs/index.html was not generated. Cannot create PR."
            exit 1
        fi

        # Set up Git bot identity
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Check for changes
        if git diff --exit-code docs/index.html; then
            echo "docs/index.html has not changed. Skipping commit and PR creation."
        else
            echo "docs/index.html has changed. Creating branch, committing, and opening PR."
            
            BRANCH_NAME="automated-resume-update-${{ github.run_id }}"
            git checkout -b $BRANCH_NAME
            
            git add docs/index.html
            git commit -m "Automated resume update from Google Doc"

            git push origin HEAD:$BRANCH_NAME
            
            # Give the GitHub backend 2 seconds to register the branch commit
            sleep 2
            
            # Create headless PR using fill parameters to bypass the GraphQL SHA bug
            gh pr create \
              --title "Automated Resume Update" \
              --body "Automated update of the resume from the Google Doc via cron schedule." \
              --fill
        fi