name: Automated Resume Generation

on:
  # Trigger on a specific schedule (e.g., first day of every month at 3 AM UTC)
  schedule:
    - cron: '0 0 1 * *' 
  workflow_dispatch: # Allows manual triggering for testing
    inputs:
      trigger:
        description: 'Manual run trigger'
        required: true
        type: boolean
  # Add other triggers if needed, e.g., push to main

jobs:
  generate_resume:
    runs-on: ubuntu-latest
    
    # Define environment variables using GitHub Secrets
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DOC_FILE_ID: ${{ secrets.GOOGLE_DOC_FILE_ID }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        # Install Google API client libraries
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib
        # Install Pandoc and necessary build tools to handle potential permission errors
        sudo apt-get update
        sudo apt-get install -y pandoc build-essential

    - name: Generate Resume HTML
      run: python generate_resume.py
      
    - name: Commit and Create Pull Request
      run: |
        if [ ! -f "docs/index.html" ]; then
            echo "Error: docs/index.html was not generated. Cannot create PR."
            exit 1
        fi

        # Check if the generated file content differs from the last committed version
        if git diff --exit-code docs/index.html; then
            echo "docs/index.html has not changed. Skipping commit and PR creation."
        else
            echo "docs/index.html has changed. Creating branch, committing, and opening PR."
            # 1. Create a temporary branch for the changes
            git checkout -b automated-resume-update-${{ github.run_id }}
            
            # 2. Add and commit the updated file
            git add docs/index.html
            git commit -m "Automated resume update from Google Doc"

            # 3. Push the changes to the remote and create a PR
            git push origin HEAD:automated-resume-update-${{ github.run_id }}
            gh pr create --title "Automated Resume Update" --body "Automated update of the resume from the Google Doc via cron schedule." --web