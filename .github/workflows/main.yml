name: Automated Resume Generation

on:
  schedule:
    - cron: '0 0 1 * *' 
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Manual run trigger'
        required: true
        type: boolean

jobs:
  generate_resume:
    runs-on: ubuntu-latest
    environment: master
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DOC_FILE_ID: ${{ secrets.GOOGLE_DOC_FILE_ID }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        # Install Google API client libraries
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib
        # Install Pandoc and necessary build tools to handle potential permission errors
        sudo apt-get update
        sudo apt-get install -y pandoc build-essential

    - name: Generate Resume HTML
      run: python generate_resume.py
      
    - name: Commit and Create Pull Request
      env:
        # Give the GitHub CLI tool permission to talk back to your repo
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ ! -f "docs/index.html" ]; then
            echo "Error: docs/index.html was not generated. Cannot create PR."
            exit 1
        fi

        # 1. Set up a dummy bot identity for the commit history
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # Check if the generated file content differs from the last committed version
        if git diff --exit-code docs/index.html; then
            echo "docs/index.html has not changed. Skipping commit and PR creation."
        else
            echo "docs/index.html has changed. Creating branch, committing, and opening PR."
            
            # 2. Create a temporary branch for the changes
            BRANCH_NAME="automated-resume-update-${{ github.run_id }}"
            git checkout -b $BRANCH_NAME
            
            # 3. Add and commit the updated file
            git add docs/index.html
            git commit -m "Automated resume update from Google Doc"

            # 4. Push the changes up to GitHub
            git push origin HEAD:$BRANCH_NAME
            
            # 5. Create the PR completely headlessly (No --web flag)
            gh pr create \
              --title "Automated Resume Update" \
              --body "Automated update of the resume from the Google Doc via cron schedule." \
              --head "$BRANCH_NAME" \
              --base "main"
        fi